<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>X AI Filter</title>
    <style>
      body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
      label { display: block; margin-top: 20px; font-weight: 600; }
      input[type="password"], select, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px; font: inherit; }
      textarea { height: 160px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
      .hint { color: #666; font-weight: 400; font-size: 12px; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      #status { color: #0a7d32; min-height: 1.5em; }
      #stale { margin-top: 16px; padding: 10px 12px; border: 1px solid #b00020; border-radius: 6px; color: #b00020; }
    </style>
  </head>
  <body>
    <h1>X AI Filter <span id="version" class="hint"></span></h1>

    <div id="stale" hidden>
      Chrome is running version <span id="runningVersion"></span>. The files on disk are version <span id="diskVersion"></span>. Reload the extension, then reload x.com.
    </div>

    <label for="apiKey">TypeSafe API key</label>
    <input id="apiKey" type="password" autocomplete="off" />

    <label for="threshold">Hide at or above <span id="thresholdValue"></span>%</label>
    <input id="threshold" type="range" min="50" max="99" step="1" />

    <label for="mode">When a tweet is flagged</label>
    <select id="mode">
      <option value="collapse">Collapse it</option>
      <option value="animated">Animated</option>
      <option value="dim">Dim it</option>
      <option value="badge">Only show a badge</option>
    </select>

    <label><input id="labeling" type="checkbox" /> Show AI / Human label buttons on every scored tweet</label>

    <label for="weights">Weights JSON <span class="hint">Paste the output of scripts/fit.mjs. Leave empty for the defaults.</span></label>
    <textarea id="weights" spellcheck="false"></textarea>

    <div class="row">
      <button id="save">Save</button>
      <span id="status"></span>
    </div>

    <h2>Code changes</h2>
    <p class="hint">Chrome keeps the extension's page scripts in memory. After any code change, reload the extension here, then reload x.com.</p>
    <div class="row">
      <button id="reloadExtension">Reload extension</button>
    </div>

    <h2>Labels</h2>
    <p id="labelCounts"></p>
    <div class="row">
      <button id="exportLabels">Export labels.json</button>
      <button id="clearLabels">Clear labels</button>
    </div>

    <script src="src/constants.js"></script>
    <script src="src/options.js"></script>
  </body>
</html>
